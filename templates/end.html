<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TonePrint - Analysis Ended</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px 33px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 55px 66px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 95%;
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .icon { font-size: 77px; margin-bottom: 20px; }

        h1 {
            color: #333;
            font-size: 46px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        p {
            color: #666;
            font-size: 23px;
            line-height: 1.6;
            margin-bottom: 33px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 22px 66px;
            font-size: 24px;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            align-self: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .container { padding: 40px 30px; min-height: auto; }
            .icon { font-size: 70px; }
            h1 { font-size: 40px; }
            p { font-size: 20px; }
            .btn-start { font-size: 22px; padding: 20px 50px; }
        }
    
        @media (min-width: 900px) {
            html { zoom: 0.5; }
            body { min-height: 200vh; }
            .container { min-height: 160vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"></div>
        <h1>Analysis Ended</h1>
        <p>Your uploaded photo and all analysed images have been deleted from our server.<br>Thank you for using TonePrint.</p>
        <a href="/" class="btn-start">Back to Home</a>
    </div>
</body>
</html>
